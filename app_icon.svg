<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Paper base shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dx="0" dy="1.5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glass lens reflection gradient -->
    <linearGradient id="lensGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#E0F2FE" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#BAE6FD" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Golden Orange Handle gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Folded paper flap gradient -->
    <linearGradient id="foldFlapGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#FECDD3"/>
    </linearGradient>
  </defs>

  <!-- Group with soft shadow -->
  <g filter="url(#softShadow)">
    <!-- Bottom Under-layer Sheet (White paper background showing underneath) -->
    <path d="M 10 57 L 50 57 C 52.8 57 55 54.8 55 52 L 55 16 L 43 4 L 14 4 C 11.2 4 9 6.2 9 9 L 9 52 C 9 55.3 11.7 58 15 58 L 50 58 C 53.3 58 56 55.3 56 52 L 56 16 Z" fill="#FFFFFF"/>
    <rect x="9" y="8" width="46" height="51" rx="4.5" fill="#FFFFFF"/>

    <!-- Main Red PDF Document -->
    <path d="M 11 8 C 11 5.8 12.8 4 15 4 L 43.5 4 L 54 14.5 L 54 53 C 54 55.2 52.2 57 50 57 L 15 57 C 12.8 57 11 55.2 11 53 Z" fill="#EA4335"/>

    <!-- Folded flap corner shadow -->
    <path d="M 43.5 4 L 43.5 14.5 L 54 14.5 Z" fill="#B91C1C" opacity="0.2"/>

    <!-- Folded flap corner itself -->
    <path d="M 43.5 4 L 54 14.5 L 43.5 14.5 Z" fill="url(#foldFlapGrad)"/>

    <!-- Document Text: 'PDF' in crisp bold white -->
    <text x="16" y="27.5" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="14.5" font-weight="900" fill="#FFFFFF" letter-spacing="-0.6">PDF</text>

    <!-- Three Rounded Pink/Coral Lines below 'PDF' -->
    <rect x="16.5" y="33" width="18" height="3.5" rx="1.75" fill="#FCA5A5"/>
    <rect x="16.5" y="39.5" width="18" height="3.5" rx="1.75" fill="#FCA5A5"/>
    <rect x="16.5" y="46" width="12" height="3.5" rx="1.75" fill="#FCA5A5"/>
  </g>

  <!-- Magnifying Glass (Foreground) -->
  <!-- Handle extending diagonally down-right -->
  <g>
    <!-- Handle rotation centered around lens center (cx=39, cy=39) -->
    <!-- Handle path at 45 degrees: starts at x=47.5, y=47.5 to x=59, y=59 -->
    <path d="M 46.5 44.5 L 44.5 46.5 L 56 58 C 57.5 59.5 60 59.5 61.5 58 C 63 56.5 63 54 61.5 52.5 Z" fill="url(#handleGrad)" stroke="#B45309" stroke-width="0.8" stroke-linejoin="round"/>
    
    <!-- Handle highlight streak -->
    <line x1="47.5" y1="46.5" x2="58.5" y2="57.5" stroke="#FDE68A" stroke-width="1" stroke-linecap="round" opacity="0.8"/>

    <!-- Blue/Dark Collar connecting handle to lens rim -->
    <path d="M 45 43.5 L 43.5 45 L 47 48.5 L 48.5 47 Z" fill="#1E40AF"/>

    <!-- Circular Lens Rim (Vibrant Royal Blue) -->
    <circle cx="38.5" cy="38.5" r="13.5" fill="url(#lensGlassGrad)" stroke="#2563EB" stroke-width="3.4"/>
    <!-- Inner bright rim glow -->
    <circle cx="38.5" cy="38.5" r="11.8" fill="none" stroke="#60A5FA" stroke-width="0.6" opacity="0.7"/>

    <!-- Lens Specular Glare / Reflection (curved crescent on top-left) -->
    <path d="M 30 35 C 31 29.5 35.5 27 41.5 27 C 37 28 32.5 30.5 31.5 36 Z" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="32.5" cy="33" r="1.2" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>